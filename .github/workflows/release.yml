name: Release

# Dispara al tagear vX.Y.Z. Publica: binarios multi-plataforma en el GitHub Release
# + imagen OCI multi-arch (amd64+arm64) firmada con cosign keyless.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write   # crear el Release + subir binarios
  packages: write   # push a GHCR
  id-token: write   # cosign keyless (Fulcio/Rekor)

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build binaries (linux/darwin/windows × amd64/arm64)
        run: |
          VERSION="${GITHUB_REF_NAME:-$(cat VERSION)}"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = windows ] && ext=".exe"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/leloir-${os}-${arch}${ext}" ./cmd/leloir
            done
          done
          ( cd dist && sha256sum leloir-* > SHA256SUMS )
          ls -la dist
      # Notas del release = la sección del CHANGELOG para este tag (features técnicas,
      # NO la lista de commits). Así el release cuenta QUÉ mejoró, no quién lo hizo.
      - name: Notas del release desde el CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME}"
          awk -v v="$VER" '
            $0 ~ "^## " v " " {f=1; next}
            /^## v[0-9]/ {f=0}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Si el CHANGELOG no tuviera la sección, dejamos un fallback mínimo (no vacío).
          [ -s RELEASE_NOTES.md ] || echo "Release ${VER}. Ver CHANGELOG.md." > RELEASE_NOTES.md
          {
            echo ""
            echo "---"
            echo "**Install:** \`curl -fsSL https://raw.githubusercontent.com/villadalmine/leloir-cli/main/install.sh | sh\`  ·  image \`ghcr.io/villadalmine/leloir-cli:${VER}\` (multi-arch, signed with cosign keyless)."
          } >> RELEASE_NOTES.md
          echo "=== release notes ==="; cat RELEASE_NOTES.md
      - name: Publish GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3   # cross-compila (el Dockerfile usa TARGETARCH)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/villadalmine/leloir-cli:latest
            ghcr.io/villadalmine/leloir-cli:${{ github.ref_name }}
          provenance: false
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/villadalmine/leloir-cli@${{ steps.build.outputs.digest }}"
